# AI-assistant config manifest. Consumed by `python .ai/bin/ai-sync`, which
# compiles the fragments named here into a root AGENTS.md and wires every
# target tool to it. See .ai/README.md.

[project]
name = "langshift"

[stack]
# Python is the package (repo_translator/); the web UI frontend is React + TS.
languages  = ["python", "typescript"]
frameworks = ["react"]
practices  = ["testing", "git-commits", "security", "architecture", "documentation"]

[tools]
targets = ["claude", "cursor", "gemini", "copilot"]

[options]
# `copy` rather than `symlink`: CI (actions/checkout without `submodules:`) and
# Vercel-style builds never initialize .ai, and ogen-ai is a private repo — a
# symlink would dangle there and take AGENTS.md with it. Real files always
# resolve. Re-run ai-sync after pulling rule updates.
link_mode = "copy"
local_tail = "ai-config.local.md"
