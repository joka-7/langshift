[build-system]
requires = ["setuptools>=83.0.0", "wheel"]  # >=83.0.0 fixes PYSEC-2026-3447
build-backend = "setuptools.build_meta"

[project]
name = "repo-translator"
version = "0.1.0"
description = "Translate a code repository from one programming language to another using Claude AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "setuptools>=83.0.0",  # fixes PYSEC-2026-3447; the ambient interpreter's
                           # setuptools isn't otherwise upgraded by `pip install -e .`
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-generativeai>=0.5",
]
ollama = [
    "ollama>=0.1",
]
groq = [
    "groq>=0.9",
]
all-providers = [
    "openai>=1.0",
    "google-generativeai>=0.5",
    "ollama>=0.1",
    "groq>=0.9",
]
# --backend model-dispatcher (see repo_translator/providers/model_dispatcher_provider.py).
# Pulled in with model-dispatcher's own [openai,anthropic,gemini] extras — those
# cover claude/openai/gemini/groq (Groq is an `openai`-SDK adapter there too) —
# note its `gemini` extra installs `google-genai`, not this repo's own `gemini`
# extra's `google-generativeai`; the two SDKs don't overlap.
# ModelDispatcher is currently a private repo: this URL only resolves for
# someone with git access to it (`pip install`'s git+https prompts for
# credentials, or reads them from your normal git credential helper — nothing
# repo-translator-specific to configure). Not part of `dev`/`all-providers` so
# CI and the default install never need that access.
model-dispatcher = [
    "model-dispatcher[openai,anthropic,gemini] @ git+https://github.com/joka-7/ModelDispatcher.git@0b265175ee96c5681f98482bee1e428d25cfa9a2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: exercises real subprocesses / file I/O / HTTP instead of mocks",
]

[tool.coverage.run]
source = ["repo_translator"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A dense table of regex-based rewrite rules; wrapping them hurts readability
# more than the line length helps.
"repo_translator/offline/ts_to_py.py" = ["E501"]
# Tests frequently embed literal source-code fixtures and long assertion
# messages inline; wrapping them hurts readability more than it helps.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The optional provider SDKs (openai, google-generativeai, ollama, groq) are
# imported lazily inside functions so the package works without them
# installed; ignore_missing_imports keeps mypy usable without all extras.

[[tool.mypy.overrides]]
# model-dispatcher (the [model-dispatcher] extra) requires Python >=3.12 and
# uses 3.12-only syntax (PEP 695 `type` statements) in its own source. mypy
# would otherwise try to parse that source under this project's
# python_version = "3.10" target and fail on syntax it doesn't have anything
# to do with checking here. follow_imports = "skip" treats it as opaque/Any
# instead — repo_translator's own use of it is still checked normally.
module = "model_dispatcher.*"
follow_imports = "skip"

[project.scripts]
repo-translate = "repo_translator.cli:main"
repo-translate-ui = "repo_translator.webui.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_translator*"]

[project.urls]
Homepage = "https://github.com/your-username/repo-translator"
