[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-translator"
version = "0.1.0"
description = "Translate a code repository from one programming language to another using Claude AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-generativeai>=0.5",
]
ollama = [
    "ollama>=0.1",
]
all-providers = [
    "openai>=1.0",
    "google-generativeai>=0.5",
    "ollama>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.scripts]
repo-translate = "repo_translator.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/your-username/repo-translator"
