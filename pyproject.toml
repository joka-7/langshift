[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-translator"
version = "0.1.0"
description = "Translate a code repository from one programming language to another using Claude AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-generativeai>=0.5",
]
ollama = [
    "ollama>=0.1",
]
groq = [
    "groq>=0.9",
]
all-providers = [
    "openai>=1.0",
    "google-generativeai>=0.5",
    "ollama>=0.1",
    "groq>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: exercises real subprocesses / file I/O / HTTP instead of mocks",
]

[project.scripts]
repo-translate = "repo_translator.cli:main"
repo-translate-ui = "repo_translator.webui.main:run"

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/your-username/repo-translator"
