# Hand-written notes for docs/STRUCTURE.md's generated tree.
# Python files already carry real module docstrings gen_tree.py derives
# automatically. These notes cover only frontend/ (.tsx, no docstring
# convention for the generator to read) and top-level orientation.

[notes]
"repo_translator" = "The CLI/agent package — providers, offline mode, report generation"
"repo_translator/providers" = "One LLM provider adapter per file, behind a shared base interface"
"repo_translator/webui" = "FastAPI backend for the web UI (run via `repo-translate-ui`)"
"repo_translator.egg-info" = "Build metadata (setuptools) — not hand-maintained"
"frontend" = "React + Vite + TypeScript web UI, talking to repo_translator/webui's API"
"frontend/src/components/EstimatePanel.tsx" = "Pre-translation cost/token estimate"
"frontend/src/components/HistoryView.tsx" = "Past translation runs"
"frontend/src/components/OutputBrowser.tsx" = "Browse the translated output tree"
"frontend/src/components/ProgressView.tsx" = "Live progress of an in-flight translation"
"frontend/src/components/ReportView.tsx" = "Renders the Markdown/JSON translation report"
"frontend/src/components/TranslateForm.tsx" = "Job submission form: source repo, target language, provider"
"frontend/e2e" = "Playwright end-to-end specs"
"tests" = "pytest suite for repo_translator (agent, CLI, providers, offline mode)"

# Generated by `python .ai/bin/ai-sync` from ai-config.toml. Without these the
# tree derives each one's note from its first heading — all four say
# "AGENTS.md", which tells a reader nothing they can't see from the filename.
"AGENTS.md" = "The compiled coding rules every AI assistant reads — generated, do not hand-edit"
"CLAUDE.md" = "Claude Code's copy of AGENTS.md (generated)"
"GEMINI.md" = "Gemini CLI's copy of AGENTS.md (generated)"
".github/copilot-instructions.md" = "Copilot's copy of AGENTS.md (generated)"
"ai-config.toml" = "Which rule fragments and target tools ai-sync compiles for this repo"
"LICENSE" = "MIT — the licence pyproject.toml's [project] table declares"
"SECURITY.md" = "Threat model (it executes generated code) and how to report a vulnerability"
"ai-config.local.md" = "Project-specific rules appended verbatim to the generated AGENTS.md"
".ai" = "ogen-ai submodule — the shared source of rules, skills and the ai-sync generator"
