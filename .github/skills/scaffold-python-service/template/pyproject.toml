# Baseline pyproject.toml for scaffold-python-service. The skill copies this and
# renames the `example_service` package to whatever the user asked for — search and
# replace that one string, including the `[tool.hatch.build.targets.wheel]` path below.

[project]
name = "example-service"
version = "0.1.0"
description = "TODO: one-line description."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # FastAPI's TestClient needs this
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_service"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
