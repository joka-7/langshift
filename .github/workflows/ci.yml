name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + dev/webui deps
        run: pip install -e ".[dev,webui]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy repo_translator

  python-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10, so 3.10 is part of
        # the contract and has to be tested — the tomllib fallback in
        # manifest.py only runs there. 3.12 is what everything else in
        # the portfolio runs.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/webui deps
        run: pip install -e ".[dev,webui]"

      - name: Run fast unit tests (mocked providers, no subprocesses/threads)
        run: pytest -m "not integration"

  python-integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10, so 3.10 is part of
        # the contract and has to be tested — the tomllib fallback in
        # manifest.py only runs there. 3.12 is what everything else in
        # the portfolio runs.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/webui deps
        run: pip install -e ".[dev,webui]"

      - name: Run integration tests (real subprocesses, file I/O, HTTP)
        run: pytest -m integration

  python-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + dev/webui deps
        run: pip install -e ".[dev,webui]"

      - name: Run full suite with coverage gate
        # cli.py and webui/* are only exercised by integration-marked tests, so
        # coverage must be measured across the whole suite, not the fast lane
        # alone (which reports ~69%). Ratchet this threshold up as gaps close
        # (measured ~95% after closing the cli.py/report.py/agent.py/webui/
        # providers gaps; offline/ts_to_py.py's regex table is the main
        # remaining gap at ~90% and is intentionally lower-priority).
        run: pytest --cov=repo_translator --cov-report=term-missing --cov-fail-under=92

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # jsdom 30 (a vitest dev dependency) requires Node >=22.22.2; Node 20
          # doesn't just warn on this — it hard-crashes at runtime inside
          # jsdom's undici dependency ("webidl.util.markAsUncloneable is not
          # a function").
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Vitest unit tests
        run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python-lint, python-unit-tests, python-integration-tests, python-coverage, frontend-checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + webui deps
        run: pip install -e ".[webui]"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # jsdom 30 (a vitest dev dependency) requires Node >=22.22.2; Node 20
          # doesn't just warn on this — it hard-crashes at runtime inside
          # jsdom's undici dependency ("webidl.util.markAsUncloneable is not
          # a function").
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
